<body>
<main><div class='panel'><!--i class='fas fa-shapes'></i-->
<h1 class='mb-4 text-primary'>AreaSolver - Land Area Calc</h1>
<div class='input-section'>
<div class='input-row'>
<div class='input-group'>
<span class='input-group-text'>Side A</span>
<input class='form-control' id='feetA' placeholder='Feet' type='number'/>
<input class='form-control' id='inchesA' placeholder='Inches' type='number'/>
</div>
<div class='input-group'>
<span class='input-group-text'>Side B</span>
<input class='form-control' id='feetB' placeholder='Feet' type='number'/>
<input class='form-control' id='inchesB' placeholder='Inches' type='number'/>
</div>
<div class='input-group'>
<span class='input-group-text'>Side C</span>
<input class='form-control' id='feetC' placeholder='Feet' type='number'/>
<input class='form-control' id='inchesC' placeholder='Inches' type='number'/>
</div>
</div>
</div>
<div class='history-controls'>
<button class='btn btn-primary' onclick='calculateArea()'>
<i class='fas fa-calculator'></i>Calculate
      </button>
<button class='btn btn-secondary' onclick='clearFields()'>
<i class='fas fa-eraser'></i>Clear
      </button>
</div>
</div>
<div class='panel'>
<h3 class='mb-4 text-primary'><i class='fas fa-check'></i> Results</h3>
<div class='current-calculation mt-4'>
<div class='alert' id='currentCalculation'></div>
</div>
<div class='history-controls'>
<button class='btn btn-success' id='addButton' onclick='addToHistory()'>
<i class='fas fa-plus'></i>Add to Table
      </button>
</div>
</div></main>
<div class='panel' style='margin-top:15px; padding: 25px;'>
<h3 class='mb-4 text-primary'><i class='fas fa-history'></i> History</h3>
<div class='history-controls' style='margin-bottom:10px;'>
<button class='btn btn-warning' onclick='undo()'>
<i class='fas fa-undo'></i>Undo
      </button>
<button class='btn btn-info' onclick='redo()'>
<i class='fas fa-redo'></i>Redo
      </button>
<button class='btn btn-danger' onclick='clearHistory()'>
<i class='fas fa-trash'></i>Clear All
      </button>
</div>
<div class='results-table'>
<table class='table'>
<thead>
<tr>
<th>#</th>
<th>Side A</th>
<th>Side B</th>
<th>Side C</th>
<th>Area (sq.ft)</th>
</tr>
</thead>
<tbody id='resultsBody'>
</tbody>
</table>
</div>
<div class='conversion-result' id='conversionResult'></div>
<div class='export-buttons'>
<button class='btn btn-success' onclick='exportToExcel()'>
<i class='fas fa-file-excel'></i>Export Excel
      </button>
<button class='btn btn-danger' onclick='exportToPDF()'>
<i class='fas fa-file-pdf'></i>Export PDF
      </button>
</div>
</div>
